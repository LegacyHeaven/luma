<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>LUMA - pick spotlight position</title>
  <style>
    /* This whole page IS the picker - a fullscreen transparent overlay
       (see window::open_position_picker) that just wants a crosshair
       cursor and a small instruction hint near the top. No theme.css here:
       it's chrome, not themable content, same reasoning as main.js's
       showFatalBanner/showUpdateBanner. */
    html, body {
      margin: 0;
      width: 100%;
      height: 100%;
      background: transparent;
      cursor: crosshair;
      overflow: hidden;
      font-family: 'Courier New', monospace;
      user-select: none;
    }

    .hint {
      position: fixed;
      top: 36px;
      left: 50%;
      transform: translateX(-50%);
      background: rgba(18, 10, 28, .92);
      color: #fff;
      border: 1px solid rgba(207, 89, 230, .5);
      border-radius: 8px;
      padding: 10px 18px;
      font-size: 14px;
      letter-spacing: .3px;
      box-shadow: 0 10px 30px rgba(0, 0, 0, .5);
      white-space: nowrap;
    }

    .hint code {
      background: rgba(255, 255, 255, .08);
      border-radius: 4px;
      padding: 1px 6px;
    }

    .crosshair {
      position: fixed;
      width: 1px;
      height: 100%;
      top: 0;
      background: rgba(207, 89, 230, .35);
      pointer-events: none;
    }

    .crosshair.h {
      width: 100%;
      height: 1px;
      left: 0;
    }
  </style>
</head>
<body>
  <div class="hint">Click anywhere to place the spotlight there &mdash; press <code>Esc</code> to cancel</div>
  <div class="crosshair" id="crosshair-v"></div>
  <div class="crosshair h" id="crosshair-h"></div>

  <script>
    (function () {
      "use strict";

      function getTauriBridge() {
        return window.__TAURI__ && window.__TAURI__.core ? window.__TAURI__ : null;
      }

      var crosshairV = document.getElementById("crosshair-v");
      var crosshairH = document.getElementById("crosshair-h");

      document.addEventListener("mousemove", function (e) {
        crosshairV.style.left = e.clientX + "px";
        crosshairH.style.top = e.clientY + "px";
      });

      // The click/Escape handlers below used to be attached only after a
      // one-time poll (up to 20 tries, 100ms apart - 2s total) found
      // window.__TAURI__ ready, inside init(). If the bridge wasn't ready
      // within that 2s window - plausible for this particular window,
      // which is a fullscreen always-on-top transparent overlay doing
      // extra Windows-specific backdrop/WebView2 setup on creation - init()
      // gave up silently and *never tried again*, permanently leaving this
      // window with no click or Escape handling at all (mousemove kept
      // working since that listener is attached unconditionally above,
      // which is exactly why the crosshair still tracked the cursor on a
      // window that was otherwise completely stuck). That matched a real,
      // reproduced bug: the picker would occasionally become unresponsive
      // to both click and Escape, recoverable only by force-closing the
      // window (Alt+F4).
      //
      // Fixed by not gating handler *attachment* on the bridge being ready
      // at all: click/keydown listeners go on immediately, and each one
      // resolves the bridge fresh at the moment it actually fires. By the
      // time a user can click on or focus this window it's already visible
      // and receiving input, so the bridge is certainly ready by then -
      // whether that took 50ms or 5s no longer matters.
      document.addEventListener("click", function (e) {
        var tauri = getTauriBridge();
        if (!tauri) return;
        var xFrac = e.clientX / window.innerWidth;
        var yFrac = e.clientY / window.innerHeight;
        tauri.core
          .invoke("report_spotlight_position", { xFrac: xFrac, yFrac: yFrac })
          .catch(function () {});
      });

      document.addEventListener("keydown", function (e) {
        if (e.key !== "Escape") return;
        var tauri = getTauriBridge();
        if (!tauri) return;
        tauri.core.invoke("cancel_position_pick").catch(function () {});
      });

      // The focus-changed auto-cancel (alt-tabbing away, or anything else
      // stealing focus, cancels too - a fullscreen always-on-top overlay
      // left dangling in the background would otherwise block clicks on
      // whatever's under it) still needs the bridge's window API, which
      // isn't safe to call before it exists. Keep polling for it, but
      // don't give up after a couple of seconds - retry indefinitely
      // (capped, generously, at two minutes) since there's nothing else
      // this listener can fall back to.
      function registerFocusCancel(attempt) {
        attempt = attempt || 1;
        var tauri = getTauriBridge();
        if (!tauri) {
          if (attempt < 1200) {
            setTimeout(function () { registerFocusCancel(attempt + 1); }, 100);
          }
          return;
        }
        tauri.window.getCurrentWindow().onFocusChanged(function (event) {
          if (!event.payload) {
            tauri.core.invoke("cancel_position_pick").catch(function () {});
          }
        });
      }

      registerFocusCancel();
    })();
  </script>
</body>
</html>
