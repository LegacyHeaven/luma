<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>LUMA - pick spotlight position</title>
  <style>
    /* This whole page IS the picker - a fullscreen transparent overlay
       (see window::open_position_picker) that just wants a crosshair
       cursor and a small instruction hint near the top. No theme.css here:
       it's chrome, not themable content, same reasoning as main.js's
       showFatalBanner/showUpdateBanner. */
    html, body {
      margin: 0;
      width: 100%;
      height: 100%;
      background: transparent;
      cursor: crosshair;
      overflow: hidden;
      font-family: 'Courier New', monospace;
      user-select: none;
    }

    .hint {
      position: fixed;
      top: 36px;
      left: 50%;
      transform: translateX(-50%);
      background: rgba(18, 10, 28, .92);
      color: #fff;
      border: 1px solid rgba(207, 89, 230, .5);
      border-radius: 8px;
      padding: 10px 18px;
      font-size: 14px;
      letter-spacing: .3px;
      box-shadow: 0 10px 30px rgba(0, 0, 0, .5);
      white-space: nowrap;
    }

    .hint code {
      background: rgba(255, 255, 255, .08);
      border-radius: 4px;
      padding: 1px 6px;
    }

    .crosshair {
      position: fixed;
      width: 1px;
      height: 100%;
      top: 0;
      background: rgba(207, 89, 230, .35);
      pointer-events: none;
    }

    .crosshair.h {
      width: 100%;
      height: 1px;
      left: 0;
    }
  </style>
</head>
<body>
  <div class="hint">Click anywhere to place the spotlight there &mdash; or it cancels itself in <code id="countdown">10</code>s</div>
  <div class="crosshair" id="crosshair-v"></div>
  <div class="crosshair h" id="crosshair-h"></div>

  <script>
    (function () {
      "use strict";

      function getTauriBridge() {
        return window.__TAURI__ && window.__TAURI__.core ? window.__TAURI__ : null;
      }

      var crosshairV = document.getElementById("crosshair-v");
      var crosshairH = document.getElementById("crosshair-h");
      var countdownEl = document.getElementById("countdown");

      document.addEventListener("mousemove", function (e) {
        crosshairV.style.left = e.clientX + "px";
        crosshairH.style.top = e.clientY + "px";
      });

      // This is the only way to cancel the picker without placing a spot -
      // there used to also be an Esc handler, but that depended on this
      // fullscreen, chromeless, always-on-top window actually holding OS
      // keyboard focus the moment Esc was pressed, and that proved flaky
      // enough on Windows across several attempts at fixing it outright
      // that it wasn't worth keeping around at all: a user whose Esc press
      // didn't land for whatever reason would be stuck behind a fullscreen
      // overlay with only a click (which places a spot, not cancels) as a
      // way out. A plain countdown needs no keyboard focus at all - just a
      // timer and the same `cancel_position_pick` call Esc used to make -
      // so it can't be defeated by whatever's going on with focus on any
      // given machine. `settled` just stops this from firing a redundant
      // extra invoke after the user has already placed a spot or the window
      // lost focus some other way.
      var settled = false;
      var secondsLeft = 10;
      var countdownTimer = setInterval(function () {
        if (settled) {
          clearInterval(countdownTimer);
          return;
        }
        secondsLeft -= 1;
        if (secondsLeft <= 0) {
          settled = true;
          clearInterval(countdownTimer);
          var tauri = getTauriBridge();
          if (tauri) tauri.core.invoke("cancel_position_pick").catch(function () {});
          return;
        }
        if (countdownEl) countdownEl.textContent = String(secondsLeft);
      }, 1000);

      // The click handler below used to be attached only after a one-time
      // poll (up to 20 tries, 100ms apart - 2s total) found window.__TAURI__
      // ready, inside init(). If the bridge wasn't ready within that 2s
      // window - plausible for this particular window, which is a
      // fullscreen always-on-top transparent overlay doing extra Windows-
      // specific backdrop/WebView2 setup on creation - init() gave up
      // silently and *never tried again*, permanently leaving this window
      // with no click handling at all (mousemove kept working since that
      // listener is attached unconditionally above, which is exactly why
      // the crosshair still tracked the cursor on a window that was
      // otherwise completely stuck). That matched a real, reproduced bug:
      // the picker would occasionally become unresponsive to clicks,
      // recoverable only by force-closing the window (Alt+F4) or waiting
      // out the countdown above.
      //
      // Fixed by not gating handler *attachment* on the bridge being ready
      // at all: the click listener goes on immediately, and resolves the
      // bridge fresh at the moment it actually fires. By the time a user
      // can click this window it's already visible and receiving input, so
      // the bridge is certainly ready by then - whether that took 50ms or
      // 5s no longer matters.
      document.addEventListener("click", function (e) {
        var tauri = getTauriBridge();
        if (!tauri) return;
        settled = true;
        var xFrac = e.clientX / window.innerWidth;
        var yFrac = e.clientY / window.innerHeight;
        tauri.core
          .invoke("report_spotlight_position", { xFrac: xFrac, yFrac: yFrac })
          .catch(function () {});
      });

      // The focus-changed auto-cancel (alt-tabbing away, or anything else
      // stealing focus, cancels too - a fullscreen always-on-top overlay
      // left dangling in the background would otherwise block clicks on
      // whatever's under it) still needs the bridge's window API, which
      // isn't safe to call before it exists. Keep polling for it, but
      // don't give up after a couple of seconds - retry indefinitely
      // (capped, generously, at two minutes) since there's nothing else
      // this listener can fall back to.
      function registerFocusCancel(attempt) {
        attempt = attempt || 1;
        var tauri = getTauriBridge();
        if (!tauri) {
          if (attempt < 1200) {
            setTimeout(function () { registerFocusCancel(attempt + 1); }, 100);
          }
          return;
        }
        tauri.window.getCurrentWindow().onFocusChanged(function (event) {
          if (!event.payload) {
            settled = true;
            tauri.core.invoke("cancel_position_pick").catch(function () {});
          }
        });
      }

      registerFocusCancel();
    })();
  </script>
</body>
</html>
