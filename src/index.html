<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>LUMA</title>
  <script>
    // Recall the last-applied theme's background before any CSS loads, so
    // the boot/transition overlay matches it instead of flashing the
    // default theme's near-black - see applyThemeCss() in main.js.
    (function () {
      try {
        var bg = localStorage.getItem("luma-boot-bg");
        if (bg) document.documentElement.style.setProperty("--boot-bg", bg);
      } catch (e) {}
    })();
  </script>
  <style>

    html, body { background: var(--boot-bg, #0a0510); margin: 0; overflow-x: hidden; }

    a { color: inherit; text-decoration: none; }
    svg { display: block; }

    /* Themed scrollbars everywhere, instead of the OS default - these vars
       are defined by every theme's :root (see theme.css), so this needs no
       per-theme copies. */
    * { scrollbar-width: thin; scrollbar-color: var(--box-border-color, #3a1f5c) transparent; }
    ::-webkit-scrollbar { width: 10px; height: 10px; }
    ::-webkit-scrollbar-track { background: transparent; }
    ::-webkit-scrollbar-thumb {
      background: var(--box-border-color, #3a1f5c);
      border-radius: 5px;
      border: 2px solid transparent;
      background-clip: padding-box;
    }
    ::-webkit-scrollbar-thumb:hover { background: var(--color-purple, #8000ff); }
    ::-webkit-scrollbar-corner { background: transparent; }

    /* Update-available banner - themed like the rest of the app instead of
       a hardcoded purple, see showUpdateBanner() in main.js. */
    .luma-update-banner {
      position: fixed;
      left: 50%;
      bottom: 22px;
      transform: translateX(-50%);
      z-index: 9998;
      display: flex;
      align-items: center;
      gap: 12px;
      max-width: calc(100% - 40px);
      background: var(--box-first-color, #120a1c);
      color: var(--color-white, #fff);
      font-family: var(--font-family, monospace);
      font-size: 13px;
      padding: 10px 14px;
      border-radius: 8px;
      border: 1px solid var(--box-border-color, #3a1f5c);
      box-shadow: 0 10px 30px rgba(0, 0, 0, .5);
    }
    .luma-update-banner-btn {
      font-family: inherit;
      font-size: 13px;
      padding: 5px 12px;
      border-radius: 5px;
      border: 1px solid var(--color-light-purple, #cf59e6);
      background: rgba(255, 255, 255, .06);
      color: var(--color-white, #fff);
      cursor: pointer;
      flex-shrink: 0;
    }
    .luma-update-banner-btn-later {
      font-size: 12px;
      padding: 5px 10px;
      border-color: transparent;
      background: transparent;
      color: var(--color-gray, #c4c4c4);
      opacity: .75;
    }

    #page-transition-overlay {
      position: fixed;
      inset: 0;
      background: var(--boot-bg, #0a0510);
      z-index: 2147483647;
      opacity: 1;
      pointer-events: none;
      transition: opacity .28s ease;
    }
    #page-transition-overlay.is-hidden { opacity: 0; }
    @media (prefers-reduced-motion: reduce) {
      #page-transition-overlay { transition-duration: .001ms; }
    }

    #boot-spinner {
      display: none;
      position: absolute;
      top: 50%;
      left: 50%;
      width: 28px;
      height: 28px;
      margin: -14px 0 0 -14px;
      border-radius: 50%;
      border: 3px solid rgba(255, 255, 255, .15);
      border-top-color: rgba(255, 255, 255, .65);
      animation: boot-spinner-spin .8s linear infinite;
    }
    body:not(.luma-ready):not(.spotlight-mode) #boot-spinner { display: block; }
    @keyframes boot-spinner-spin { to { transform: rotate(360deg); } }
    @media (prefers-reduced-motion: reduce) {
      #boot-spinner { animation: none; }
    }

    #search-tip { transition: opacity .2s ease; }
    #search-tip.tip-fading { opacity: 0; }
    @media (prefers-reduced-motion: reduce) {
      #search-tip { transition-duration: .001ms; }
    }

    html.spotlight-mode { background: transparent; }

    body.no-animations, body.no-animations * {
      animation: none !important;
      transition: none !important;
    }

    @media (prefers-reduced-motion: reduce) {
      *, *::before, *::after {
        animation-duration: 0.001ms !important;
        animation-iteration-count: 1 !important;
        transition-duration: 0.001ms !important;
      }
    }

    body.spotlight-fade-in { animation: luma-spotlight-fade-in .22s cubic-bezier(.16, 1, .3, 1); will-change: opacity, transform; }
    body.spotlight-fade-out { animation: luma-spotlight-fade-out .24s cubic-bezier(.4, 0, .68, .06) forwards; will-change: opacity, transform; }

    @keyframes luma-spotlight-fade-in {
      from { opacity: 0; transform: scale(.96) translateY(6px); }
      to { opacity: 1; transform: scale(1) translateY(0); }
    }
    @keyframes luma-spotlight-fade-out {
      from { opacity: 1; transform: scale(1) translateY(0); }
      to { opacity: 0; transform: scale(.96) translateY(6px); }
    }

    .spotlight-brand { display: none; }
    body.spotlight-mode .spotlight-brand:not([hidden]) {
      display: block;
      text-align: center;
      font-family: var(--font-family, monospace);
      font-size: 1.3rem;
      letter-spacing: 3px;
      font-weight: 700;
      text-transform: uppercase;
      color: var(--color-white, #fff);
      opacity: .85;
      margin-bottom: 10px;
    }
    body.spotlight-mode .spotlight-brand .brand-dot {
      color: var(--color-light-purple, #cf59e6);
    }
  </style>
</head>
<body>
  <div id="page-transition-overlay"><div id="boot-spinner"></div></div>
  <a href="#" class="settings-btn" id="open-settings" title="Settings" aria-label="Settings" data-i18n-title="search.settings_button" data-i18n-aria-label="search.settings_button"><svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="12" cy="12" r="3"></circle><path d="M19.4 15a1.65 1.65 0 0 0 .33 1.82l.06.06a2 2 0 1 1-2.83 2.83l-.06-.06a1.65 1.65 0 0 0-1.82-.33 1.65 1.65 0 0 0-1 1.51V21a2 2 0 0 1-4 0v-.09A1.65 1.65 0 0 0 9 19.4a1.65 1.65 0 0 0-1.82.33l-.06.06a2 2 0 1 1-2.83-2.83l.06-.06a1.65 1.65 0 0 0 .33-1.82 1.65 1.65 0 0 0-1.51-1H3a2 2 0 0 1 0-4h.09A1.65 1.65 0 0 0 4.6 9a1.65 1.65 0 0 0-.33-1.82l-.06-.06a2 2 0 1 1 2.83-2.83l.06.06a1.65 1.65 0 0 0 1.82.33H9a1.65 1.65 0 0 0 1-1.51V3a2 2 0 0 1 4 0v.09a1.65 1.65 0 0 0 1 1.51 1.65 1.65 0 0 0 1.82-.33l.06-.06a2 2 0 1 1 2.83 2.83l-.06.06a1.65 1.65 0 0 0-.33 1.82V9a1.65 1.65 0 0 0 1.51 1H21a2 2 0 0 1 0 4h-.09a1.65 1.65 0 0 0-1.51 1z"></path></svg></a>

  <div class="particles" id="particles"></div>

  <div class="wrapper">
    <p class="brand">LUMA<span class="brand-dot">.</span></p>
    <p class="motto"><span data-i18n="search.motto">One search. Every direction.</span></p>
    <p class="spotlight-brand" id="spotlight-brand" hidden>LUMA<span class="brand-dot">.</span></p>

    <div class="search-shell">
      <div class="engine-selector" id="engine-selector">
        <button type="button" class="engine-current" id="current-engine" aria-haspopup="listbox" aria-expanded="false">Google</button>
        <div class="engine-list" id="engine-list" role="listbox"></div>
      </div>

      <div class="search-box">
        <span class="terminal-prompt">&gt;</span>
        <form id="search-form" autocomplete="off">
          <input type="text" id="search-input" placeholder="search" autocomplete="off" autocapitalize="off" spellcheck="false" aria-label="Luma search input" data-i18n-placeholder="search.placeholder" data-i18n-aria-label="search.aria_label">
        </form>
        <span class="terminal-cursor">_</span>
      </div>
    </div>

    <p class="hint" id="search-tip" aria-live="polite">type <code>!bang</code> before your search to jump straight to that engine &dash; press <code>Esc</code> to clear, or your shortcut again to hide.</p>
  </div>

  <script src="vendor/titlebar.js"></script>
  <script src="debug-log.js"></script>
  <script src="i18n.js"></script>
  <script src="offline.js"></script>
  <script src="vendor/engine/bangdeck.js"></script>
  <script src="vendor/engine/ui.js"></script>
  <script src="main.js"></script>
</body>
</html>
