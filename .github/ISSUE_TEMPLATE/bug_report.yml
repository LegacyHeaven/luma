name: 🐛 Bug report
description: Something in Luma isn't working right.
title: "[Bug]: "
labels: ["bug"]
body:
  - type: textarea
    id: what-happened
    attributes:
      label: What happened?
      description: A clear description of the bug.
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: What did you expect to happen?
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: Steps to reproduce
      placeholder: |
        1. Press Alt+Space
        2. Type '!yt lofi'
        3. ...
    validations:
      required: true
  - type: input
    id: version
    attributes:
      label: Luma version
      description: Settings → About, or the title of the release you downloaded.
      placeholder: "2.10.2"
    validations:
      required: true
  - type: dropdown
    id: os
    attributes:
      label: Operating system
      options:
        - Windows
        - macOS
        - Linux
    validations:
      required: true
  - type: textarea
    id: logs
    attributes:
      label: Debug log (optional)
      description: Settings → General → enable Debug logging, reproduce the issue, then paste the relevant lines here.
      render: shell
    validations:
      required: false

