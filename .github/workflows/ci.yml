name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  engine-smoke-test:
    name: Bang engine smoke test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - run: node --check src/vendor/engine/bangdeck.js
      - run: node --check src/vendor/engine/ui.js
      - run: |
          node -e "
            const { BangDeckModule } = { BangDeckModule: require('./src/vendor/engine/bangdeck.js') };
            const cfg = JSON.parse(require('fs').readFileSync('src-tauri/resources/engines.json', 'utf8'));
            const deck = new BangDeckModule.BangDeck(cfg);
            const r = deck.resolve('!yt lofi beats');
            if (r.engine !== 'YouTube' || !r.url.includes('lofi')) {
              console.error('bang resolution smoke test failed', r);
              process.exit(1);
            }
            console.log('engines loaded:', deck.listEngines().length);
          "

  build:
    name: Build and check
    runs-on: ubuntu-22.04
    defaults:
      run:
        working-directory: src-tauri
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy, rustfmt
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri
      - name: Install Linux system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libwebkit2gtk-4.1-dev \
            libgtk-3-dev \
            libayatana-appindicator3-dev \
            librsvg2-dev \
            build-essential
      - name: Format check
        run: cargo fmt --check
      - name: Clippy
        run: cargo clippy --all-targets -- -D warnings
      - name: Build
        run: cargo build --release
