[package]
name = "luma"
version = "0.1.0"
description = "Luma - the open-source spotlight search for every desktop. BangDeck !bang search, everywhere."
authors = ["Luma contributors"]
license = "MIT"
repository = "https://github.com/LegacyHeaven/luma"
edition = "2021"
rust-version = "1.77"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["tray-icon", "macos-private-api"] }
tauri-plugin-opener = "2"
tauri-plugin-global-shortcut = "2"
tauri-plugin-autostart = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
toml = "0.8"
url = "2"

[profile.release]
panic = "abort"
codegen-units = 1
lto = true
opt-level = "s"
strip = true
