[package]
name = "luma"
version = "2.10.3"
description = "Luma - the open-source spotlight search for every desktop. One search, every direction."
authors = ["Luma contributors"]
license = "MIT"
repository = "https://github.com/LegacyHeaven/luma"
edition = "2021"
rust-version = "1.77"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["tray-icon", "macos-private-api"] }
tauri-plugin-opener = "2"
tauri-plugin-global-shortcut = "2"
tauri-plugin-autostart = "2"
tauri-plugin-single-instance = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
toml = "0.8"
url = "2"
sysinfo = "0.32"
ureq = "2"
sha2 = "0.10"
tauri-plugin-dialog = "2"
zip = "2"

[target."cfg(windows)".dependencies.windows]
version = "0.61"
features = ["Win32_Foundation", "Win32_Graphics_Dwm", "Win32_UI_Shell", "Win32_UI_WindowsAndMessaging"]

[target."cfg(windows)".dependencies.webview2-com]
version = "0.38.2"

[profile.release]
panic = "abort"
codegen-units = 1
lto = true
opt-level = "s"
strip = true
