[package]
name = "luma"
version = "2.2.0"
description = "Luma - the open-source spotlight search for every desktop. BangDeck !bang search, everywhere."
authors = ["Luma contributors"]
license = "MIT"
repository = "https://github.com/LegacyHeaven/luma"
edition = "2021"
rust-version = "1.77"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["tray-icon", "macos-private-api"] }
tauri-plugin-opener = "2"
tauri-plugin-global-shortcut = "2"
tauri-plugin-autostart = "2"
tauri-plugin-single-instance = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
toml = "0.8"
url = "2"
# Powers the in-app debug console's "system info" panel (RAM/PID/uptime) -
# see src/logging.rs and the get_system_info command.
sysinfo = "0.32"
# Powers the in-app updater (src/updater.rs): fetches manifest.json and
# downloads the new binary from the GitHub release. Default features pull
# in rustls rather than a system OpenSSL, so this needs nothing extra in
# CI on any of the three platforms.
ureq = "2"
# Verifies a downloaded update's sha256 against manifest.json before it's
# ever allowed to replace the running binary.
sha2 = "0.10"
tauri-plugin-dialog = "2"

# Windows-only: lets window.rs call DwmSetWindowAttribute directly (see
# disable_system_backdrop) to turn off Windows 11's automatic Mica/system-
# backdrop material on the spotlight and position-picker windows - without
# this, DWM paints its own tinted backdrop behind the per-pixel-transparent
# webview, which shows up as a solid box around the spotlight pill instead
# of it floating free on the wallpaper. Pinned to the same "0.61" that
# tauri itself already resolves to (see tauri's own Cargo.toml under
# `target."cfg(windows)".dependencies.windows`) so this shares that same
# dependency instance and its HWND type rather than pulling in a second,
# incompatible copy of the crate.
[target."cfg(windows)".dependencies.windows]
version = "0.61"
features = ["Win32_Foundation", "Win32_Graphics_Dwm"]

[profile.release]
panic = "abort"
codegen-units = 1
lto = true
opt-level = "s"
strip = true
